{% extends "layout.html" %} {% block content %}
<div class="card">
  <div class="card-body">
    <h4>Confirm Download</h4>
    <p class="text-muted">
      Enter your account password to decrypt and download
      <strong>{{ filename }}</strong>.
    </p>

    <form
      action="{{ url_for('download_file', file_id=file_id) }}"
      method="POST"
      class="row g-2 align-items-center"
    >
      <div class="col-auto">
        <input
          type="password"
          name="password_verify"
          class="form-control form-control-sm"
          placeholder="Enter Password"
          required
        />
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-success btn-sm">
          Decrypt & Download
        </button>
      </div>
    </form>

    <div class="mt-3">
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary"
        >Cancel</a
      >
    </div>
  </div>
</div>
{% endblock %}
