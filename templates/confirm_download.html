{% extends "layout.html" %} {% block content %}
<div class="card">
  <div class="card-body">
    <h4>{{ title }}</h4>
    <p class="text-muted">
      Enter your account password to decrypt and access
      <strong>{{ filename }}</strong>.
    </p>

    <form action="{{ action_url }}" method="POST" class="row g-2 align-items-center">
      <div class="col-auto">
        <input type="password" name="password_verify" class="form-control form-control-sm" placeholder="Enter Password"
          required />
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-success btn-sm">
          {{ btn_label }}
        </button>
      </div>
    </form>

    <div class="mt-3">
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </div>
</div>
{% endblock %}
